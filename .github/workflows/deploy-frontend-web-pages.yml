name: Deploy frontend-web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/frontend-web/**'
      - 'packages/domain/**'
      - 'packages/validation/**'
      - 'packages/client-core/**'
      - 'packages/api-client/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/deploy-frontend-web-pages.yml'
  pull_request:
    paths:
      - 'apps/frontend-web/**'
      - 'packages/domain/**'
      - 'packages/validation/**'
      - 'packages/client-core/**'
      - 'packages/api-client/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/deploy-frontend-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.repository.name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Type-check frontend-web
        run: npm run type-check -w frontend-web

      - name: Lint frontend-web
        run: npm run lint -w frontend-web

      - name: Unit tests frontend-web
        run: npm run test:unit -w frontend-web -- --run

      - name: Resolve Pages base path
        id: base
        run: |
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            BASE="${{ vars.PAGES_BASE_PATH }}"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          case "$BASE" in
            */) ;;
            *) BASE="${BASE}/" ;;
          esac
          echo "path=$BASE" >> "$GITHUB_OUTPUT"

      - name: Require API base URL for publish builds
        if: github.event_name != 'pull_request'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is required for GitHub Pages deploys."
            exit 1
          fi

      - name: Build frontend-web
        env:
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -w frontend-web

      - name: Add SPA fallback for GitHub Pages
        run: cp apps/frontend-web/dist/index.html apps/frontend-web/dist/404.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend-web/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
